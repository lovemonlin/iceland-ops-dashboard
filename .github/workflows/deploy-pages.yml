# Deploys the dashboard to GitHub Pages.
#
# This runs on push only. It is NOT a scheduled workflow: the hourly production data collection is a
# separate concern, and scheduled triggers on this account have been observed to be unreliable.
# Pushing a new public/data/latest-health.json is what publishes new data.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deployment be re-run by hand if one fails; it does not collect any data.
  workflow_dispatch:

# The minimum needed to publish Pages, and nothing else: no contents: write, no packages, no actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two builds at once; let a newer snapshot supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build static export
        # GitHub Pages serves project sites from /<repository>/, so the site is built with that base path.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
